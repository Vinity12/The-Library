<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books | Library</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    <link rel="stylesheet" href="stylesheets/color.css">
  </head>
  <body data-bs-theme="dark">
    <div class="d-flex" style="min-height: 100vh">
      <div
        class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark"
        style="width: 280px">
        <a href="/"
          class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
          <svg
            class="bi pe-none me-2"
            width="40"
            height="32"
            aria-hidden="true">
            <use xlink:href="#bootstrap"></use>
          </svg>
          <span class="fs-4">Library</span>
        </a>
        <hr />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="index.html" class="nav-link text-white">
              <img src="assets/svg/dashboard.svg" alt="dashboard icon">
              Dashboard
            </a>
          </li>
          <li>
            <a href="book.html" class="nav-link active"
              aria-current="page">
              <img src="assets/svg/book.svg" alt="book icon">
              Books
            </a>
          </li>
          <li>
            <a href="member.html" class="nav-link text-white">
              <img src="assets/svg/person.svg" alt="member icon">
              Members
            </a>
          </li>
        </ul>
        <hr />
        <div class="dropdown">
          <a
            href="#"
            class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            <img
              src="assets/images/Sky.jpg"
              alt="Profile picture"
              width="32"
              height="32"
              class="rounded-circle me-2" />
            <strong>Viv</strong>
          </a>
          <ul
            class="dropdown-menu dropdown-menu-dark text-small shadow">
            <li><a class="dropdown-item" href="#">Settings</a></li>
            <li><a class="dropdown-item" href="#">Profile</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li><a class="dropdown-item" href="#">Sign out</a></li>
          </ul>
        </div>
      </div>

      <main class="p-5 w-100">
        <h1 class="mb-3">Booklist</h1>
        <button type="button" class="btn btn-primary mb-3"
          data-bs-toggle="modal"
          data-bs-target="#addModal">Add new Book</button>

        <div class="modal fade" id="addModal"
          tabindex="-1"
          aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <form id="addBook" method="post" class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5"
                  id="exampleModalLabel">New
                  Book</h1>
                <button type="button" class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div>
                  <div class="mb-3">
                    <label for="book-title"
                      class="col-form-label">Title:</label>
                    <input name="title" type="text" class="form-control"
                      id="book-title" required>
                  </div>
                  <div class="mb-3">
                    <label for="author"
                      class="col-form-label">Author:</label>
                    <input name="author" type="text" class="form-control"
                      id="author" required>
                  </div>
                  <div class="mb-3">
                    <label for="release-date"
                      class="col-form-label">Release
                      Date:</label>
                    <input name="date" type="date" class="form-control"
                      id="release-date" required>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">Cancel</button>
                <button id="add" type="submit"
                  class="btn btn-primary" data-bs-dismiss="modal">Add</button>
              </div>
            </form>
          </div>
        </div>

        <div class="p-1 border rounded-3">
          <table
            class="table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Release Date</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="tableData">

            </tbody>
          </table>
        </div>
      </main>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="scripts/addBook.js"></script>
  </body>
</html>
